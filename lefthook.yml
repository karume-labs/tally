pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      run: bun typecheck
    # Repo-wide, not staged-files: these rules are invariants (arrow functions,
    # @/ imports, no unsafe casts), so a commit that only touches one file must
    # not slip past a violation added elsewhere on the branch.
    guardrails:
      run: bun run guardrails:strict
